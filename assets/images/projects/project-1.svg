<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="p1Accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#p1Bg)" />

  <!-- Grid Pattern -->
  <g stroke="url(#gridGrad)" stroke-width="1.5">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="150" y1="0" x2="150" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="450" y1="0" x2="450" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Glowing Game Controller / Dungeon Emblem -->
  <circle cx="400" cy="210" r="110" fill="url(#p1Accent)" opacity="0.15" filter="blur(20px)" />
  <circle cx="400" cy="210" r="85" fill="#182030" stroke="url(#p1Accent)" stroke-width="3" />

  <!-- Gamepad / Sword Vector -->
  <path d="M370 185 L430 185 M400 155 L400 215" stroke="url(#p1Accent)" stroke-width="6" stroke-linecap="round" />
  <circle cx="360" cy="245" r="8" fill="#ec4899" />
  <circle cx="440" cy="245" r="8" fill="#6366f1" />
  <circle cx="400" cy="255" r="6" fill="#38bdf8" />

  <!-- Title Badge -->
  <rect x="250" y="335" width="300" height="42" rx="21" fill="#0b0f19" stroke="#334155" stroke-width="1.5" />
  <text x="400" y="361" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="1">CHRONICLES OF AETHELGARD</text>
</svg>
