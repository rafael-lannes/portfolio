<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="p3Amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#p3Bg)" />

  <!-- Pixel Canvas Grid Background -->
  <g fill="#3f3f46" opacity="0.3">
    <rect x="200" y="80" width="20" height="20" />
    <rect x="240" y="80" width="20" height="20" />
    <rect x="220" y="100" width="20" height="20" />
    <rect x="560" y="120" width="20" height="20" />
    <rect x="580" y="140" width="20" height="20" />
    <rect x="600" y="120" width="20" height="20" />
  </g>

  <!-- Retro Terminal Window -->
  <rect x="180" y="70" width="440" height="290" rx="8" fill="#18181b" stroke="#f59e0b" stroke-width="2" />
  
  <!-- Terminal Header -->
  <rect x="180" y="70" width="440" height="32" fill="#27272a" />
  <circle cx="205" cy="86" r="4" fill="#ef4444" />
  <circle cx="220" cy="86" r="4" fill="#f59e0b" />
  <circle cx="235" cy="86" r="4" fill="#10b981" />
  <text x="400" y="91" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">retro_engine_v1.wasm</text>

  <!-- Code / Pixel Art inside Terminal -->
  <!-- Pixel Space Invader / Mascot in Center -->
  <g fill="url(#p3Amber)" transform="translate(350, 130) scale(4)">
    <rect x="2" y="0" width="1" height="1" />
    <rect x="8" y="0" width="1" height="1" />
    <rect x="3" y="1" width="1" height="1" />
    <rect x="7" y="1" width="1" height="1" />
    <rect x="2" y="2" width="7" height="1" />
    <rect x="1" y="3" width="2" height="1" />
    <rect x="4" y="3" width="3" height="1" />
    <rect x="8" y="3" width="2" height="1" />
    <rect x="0" y="4" width="11" height="1" />
    <rect x="0" y="5" width="1" height="1" />
    <rect x="2" y="5" width="7" height="1" />
    <rect x="10" y="5" width="1" height="1" />
    <rect x="0" y="6" width="1" height="1" />
    <rect x="2" y="6" width="1" height="1" />
    <rect x="8" y="6" width="1" height="1" />
    <rect x="10" y="6" width="1" height="1" />
    <rect x="3" y="7" width="2" height="1" />
    <rect x="6" y="7" width="2" height="1" />
  </g>

  <!-- Console Logs below -->
  <text x="210" y="240" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13">&gt; [OK] WebAssembly initialized (60 FPS)</text>
  <text x="210" y="265" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="13">&gt; [AUDIO] 8-bit Synthesizer active</text>
  <text x="210" y="290" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13">&gt; [RENDER] WebGL 2.0 Pipeline ready_</text>
</svg>
