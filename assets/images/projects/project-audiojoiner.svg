<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="audioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#audioBg)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="180" r="120" fill="#a855f7" opacity="0.15" filter="blur(25px)" />

  <!-- Audio Waveform Visualization -->
  <g transform="translate(400, 180)">
    <!-- Audio Wave Bars -->
    <rect x="-180" y="-20" width="12" height="40" rx="6" fill="url(#waveGrad)" />
    <rect x="-155" y="-35" width="12" height="70" rx="6" fill="url(#waveGrad)" />
    <rect x="-130" y="-55" width="12" height="110" rx="6" fill="url(#waveGrad)" />
    <rect x="-105" y="-30" width="12" height="60" rx="6" fill="url(#waveGrad)" />
    <rect x="-80" y="-70" width="12" height="140" rx="6" fill="url(#waveGrad)" />
    <rect x="-55" y="-45" width="12" height="90" rx="6" fill="url(#waveGrad)" />
    
    <!-- Joining Connector Icon in Center -->
    <circle cx="0" cy="0" r="32" fill="#18181b" stroke="#a855f7" stroke-width="3" />
    <path d="M-12 -12 L-4 -4 M-12 12 L-4 4 M4 0 L14 0" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <circle cx="-10" cy="-10" r="3" fill="#ec4899" />
    <circle cx="-10" cy="10" r="3" fill="#6366f1" />
    <circle cx="12" cy="0" r="3" fill="#a855f7" />

    <!-- Wave bars right -->
    <rect x="43" y="-45" width="12" height="90" rx="6" fill="url(#waveGrad)" />
    <rect x="68" y="-70" width="12" height="140" rx="6" fill="url(#waveGrad)" />
    <rect x="93" y="-30" width="12" height="60" rx="6" fill="url(#waveGrad)" />
    <rect x="118" y="-55" width="12" height="110" rx="6" fill="url(#waveGrad)" />
    <rect x="143" y="-35" width="12" height="70" rx="6" fill="url(#waveGrad)" />
    <rect x="168" y="-20" width="12" height="40" rx="6" fill="url(#waveGrad)" />
  </g>

  <!-- Title Badge -->
  <rect x="250" y="315" width="300" height="46" rx="23" fill="#18181b" stroke="#a855f7" stroke-width="1.5" />
  <text x="400" y="344" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="1">AUDIOJOINER (DESENVOLVENDO)</text>
</svg>
