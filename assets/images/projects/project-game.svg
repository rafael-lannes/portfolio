<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pGameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="50%" stop-color="#2d1b4e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pGameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa5c5c" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#pGameBg)" />

  <!-- Background decorative grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5">
    <line x1="0" y1="112" x2="800" y2="112" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="337" x2="800" y2="337" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Glowing Game Controller Emblem -->
  <circle cx="400" cy="190" r="100" fill="url(#pGameGrad)" opacity="0.2" filter="blur(20px)" />
  <rect x="290" y="125" width="220" height="130" rx="40" fill="#1e1e2f" stroke="url(#pGameGrad)" stroke-width="3" />
  
  <!-- D-Pad -->
  <path d="M350 170 L350 210 M330 190 L370 190" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" />
  
  <!-- Action Buttons -->
  <circle cx="430" cy="180" r="8" fill="#fa5c5c" />
  <circle cx="455" cy="195" r="8" fill="#a855f7" />
  <circle cx="430" cy="210" r="8" fill="#38bdf8" />
  <circle cx="405" cy="195" r="8" fill="#34d399" />

  <!-- Badge Label -->
  <rect x="260" y="300" width="280" height="46" rx="23" fill="#111827" stroke="#374151" stroke-width="1.5" />
  <text x="400" y="329" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="1">ITCH.IO GAMES &amp; PROTOTYPES</text>
</svg>
