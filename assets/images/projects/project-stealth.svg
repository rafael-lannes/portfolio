<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pStBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="pStGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#pStBg)" />

  <!-- Stealth / Tactical Visor & Crosshair -->
  <circle cx="400" cy="180" r="110" fill="none" stroke="#78716c" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="400" cy="180" r="80" fill="#1c1917" stroke="url(#pStGrad)" stroke-width="3" />
  
  <!-- Crosshair Lines -->
  <line x1="400" y1="80" x2="400" y2="110" stroke="#f59e0b" stroke-width="3" />
  <line x1="400" y1="250" x2="400" y2="280" stroke="#f59e0b" stroke-width="3" />
  <line x1="300" y1="180" x2="330" y2="180" stroke="#f59e0b" stroke-width="3" />
  <line x1="470" y1="180" x2="500" y2="180" stroke="#f59e0b" stroke-width="3" />

  <!-- Ninja / Stealth Hood Eye slit -->
  <path d="M360 170 Q400 155 440 170 Q400 185 360 170 Z" fill="#f59e0b" />
  <circle cx="385" cy="170" r="4" fill="#1c1917" />
  <circle cx="415" cy="170" r="4" fill="#1c1917" />

  <!-- Title Badge -->
  <rect x="250" y="320" width="300" height="46" rx="23" fill="#0c0a09" stroke="#78350f" stroke-width="1.5" />
  <text x="400" y="349" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="1">MODO STEALTH REVIEWS</text>
</svg>
