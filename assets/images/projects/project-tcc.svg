<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pTccBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="pTccGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#pTccBg)" />

  <!-- Document / Academic Paper Graphics -->
  <g transform="translate(400, 180)">
    <!-- Shadow Paper -->
    <rect x="-110" y="-105" width="220" height="180" rx="8" fill="#1e293b" opacity="0.5" transform="rotate(-4)" />
    <!-- Main Paper -->
    <rect x="-105" y="-100" width="210" height="180" rx="8" fill="#0f172a" stroke="url(#pTccGrad)" stroke-width="2.5" />
    
    <!-- UFF Crest / Seal Indicator -->
    <circle cx="65" cy="-60" r="18" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
    <path d="M55 -60 L75 -60 M65 -70 L65 -50" stroke="#93c5fd" stroke-width="2" />
    
    <!-- Academic Lines -->
    <rect x="-85" y="-75" width="100" height="10" rx="3" fill="#60a5fa" />
    <rect x="-85" y="-55" width="80" height="8" rx="2" fill="#94a3b8" />
    <rect x="-85" y="-35" width="160" height="6" rx="2" fill="#475569" />
    <rect x="-85" y="-20" width="170" height="6" rx="2" fill="#475569" />
    <rect x="-85" y="-5" width="150" height="6" rx="2" fill="#475569" />
    <rect x="-85" y="10" width="165" height="6" rx="2" fill="#475569" />
    <rect x="-85" y="25" width="130" height="6" rx="2" fill="#475569" />
    <rect x="-85" y="45" width="90" height="8" rx="2" fill="#3b82f6" />
  </g>

  <!-- Title Badge -->
  <rect x="250" y="320" width="300" height="46" rx="23" fill="#0b1329" stroke="#1d4ed8" stroke-width="1.5" />
  <text x="400" y="349" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="1">ARTIGO CIENTÍFICO (TCC UFF)</text>
</svg>
